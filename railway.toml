[build]
# Tell Railway to use the Dockerfile inside backend/
dockerfilePath = "backend/Dockerfile"
# Build context is the backend folder so COPY . . gets backend files only
buildContext = "backend"

[deploy]
# Railway will use the CMD from the Dockerfile, but you can override here
# healthcheckPath = "/"
# healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3